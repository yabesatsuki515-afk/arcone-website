<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARC ONE — Opening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  @property --reveal {
    syntax: '<percentage>';
    inherits: false;
    initial-value: -15%;
  }

  :root{
    --white:#ffffff;
    --ink:#12151c;
    --ink-soft:#4a5160;
    --emerald-light:#8CEDB8;
    --emerald:#00B37E;
    --emerald-deep:#00875A;
    --blue-light:#5FCBFF;
    --blue:#0090FF;
    --blue-deep:#0055D6;
    --ease-out: cubic-bezier(.16,.8,.24,1);
    --ease-soft: cubic-bezier(.22,.61,.36,1);
    --ease-cinematic: cubic-bezier(0.19, 1, 0.22, 1);
  }

  .impact-flash{
    position:absolute; inset:0;
    pointer-events:none; z-index:3;
    background:
      radial-gradient(circle at 50% 44%, rgba(140,237,184,.42), rgba(95,203,255,.28) 38%, transparent 72%),
      linear-gradient(180deg, rgba(255,255,255,.55) 0%, transparent 35%);
    opacity:0;
    mix-blend-mode:screen;
  }
  .phase-movement .impact-flash{
    animation: impactPulse 1.35s var(--ease-cinematic) forwards;
  }
  @keyframes impactPulse{
    0%{ opacity:0; transform:scale(.94); }
    18%{ opacity:.9; }
    55%{ opacity:.35; }
    100%{ opacity:0; transform:scale(1.06); }
  }

  .impact-streak{
    position:absolute; inset:-20%;
    pointer-events:none; z-index:1;
    background:linear-gradient(105deg, transparent 42%, rgba(0,179,126,.08) 48%, rgba(0,144,255,.12) 52%, transparent 58%);
    opacity:0;
    transform:translateX(-8%) scale(1.05);
    transition: opacity 1.1s var(--ease-cinematic), transform 1.8s var(--ease-cinematic);
  }
  .phase-movement .impact-streak{
    opacity:1;
    transform:translateX(8%) scale(1);
  }
  .phase-gather .impact-streak{ opacity:0; transition-duration:.9s; }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:var(--white);
    overscroll-behavior:none;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .sr-only{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .stage{
    position:relative;
    width:100%;
    height:100svh;
    min-height:560px;
    background:var(--white);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  /* ---------- ambient background layer ---------- */

  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(8,18,36,0.045) 100%);
    pointer-events:none;
  }

  .aurora{
    position:absolute; inset:-10%;
    pointer-events:none;
    z-index:0;
  }

  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.4;
    will-change:transform;
  }

  .b1{
    width:46vmax; height:46vmax;
    left:-14vmax; top:-16vmax;
    background:radial-gradient(circle at 40% 40%, var(--emerald-light), transparent 68%);
    animation: driftA 20s ease-in-out infinite;
  }

  .b2{
    width:50vmax; height:50vmax;
    right:-18vmax; bottom:-20vmax;
    background:radial-gradient(circle at 60% 60%, var(--blue-light), transparent 68%);
    animation: driftB 24s ease-in-out infinite;
  }

  .b3{
    width:34vmax; height:34vmax;
    right:6vmax; top:-10vmax;
    background:radial-gradient(circle, #eaf6ff, transparent 70%);
    opacity:.55;
    animation: driftC 17s ease-in-out infinite;
  }

  @keyframes driftA{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(4vmax,3vmax) scale(1.08); }
  }
  @keyframes driftB{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-5vmax,-3vmax) scale(1.1); }
  }
  @keyframes driftC{
    0%,100%{ transform:translate(0,0) scale(1); opacity:.5; }
    50%{ transform:translate(-3vmax,4vmax) scale(0.92); opacity:.65; }
  }

  .beam{
    position:absolute;
    top:50%; left:50%;
    width:30vw; height:180vh;
    margin-left:-11vw; margin-top:-80vh;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.85) 45%, var(--emerald-light) 58%, var(--blue-light) 72%, transparent);
    transform:translateX(-60vw) rotate(-16deg);
    opacity:0;
    filter:blur(11px);
    mix-blend-mode:normal;
    pointer-events:none;
    transition: transform 2.1s var(--ease-cinematic), opacity 1s var(--ease-cinematic);
  }
  .phase-movement .beam{
    transform:translateX(62vw) rotate(-16deg);
    opacity:1;
  }
  .phase-gather .beam{
    transform:translateX(60vw) rotate(-16deg);
    opacity:0;
    transition: transform 1.4s var(--ease-soft), opacity .8s ease;
  }
  .phase-idle .beam{
    animation: idleBeam 10s ease-in-out infinite;
    animation-delay:2.4s;
  }
  @keyframes idleBeam{
    0%,90%{ transform:translateX(-60vw) rotate(-16deg); opacity:0; }
    96%{ opacity:.16; }
    100%{ transform:translateX(60vw) rotate(-16deg); opacity:0; }
  }

  .particles{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:1;
  }

  .particle{
    position:absolute;
    border-radius:50%;
    opacity:0;
    animation: floaty var(--fdur,9s) cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    animation-delay: var(--fdelay,0s);
    transition: opacity 1.2s ease;
  }
  .phase-movement .particle,
  .phase-gather .particle{ opacity:var(--fop,.72); }

  @keyframes floaty{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(var(--fx,10px), var(--fy,-14px)); }
  }

  /* ---------- content / logo lockup ---------- */

  .content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:6vh 6vw;
    width:100%;
  }

  .pre-glow{
    position:absolute;
    width:40vmin; height:40vmin;
    left:50%; top:44%;
    margin-left:-20vmin; margin-top:-20vmin;
    border-radius:50%;
    background:radial-gradient(circle, rgba(0,179,126,.32), rgba(0,144,255,.24) 55%, transparent 74%);
    filter:blur(34px);
    opacity:0;
    transform:scale(.4);
    pointer-events:none;
    z-index:1;
    transition: opacity 1.4s var(--ease-cinematic), transform 1.8s var(--ease-cinematic);
  }
  .phase-curiosity .pre-glow{ opacity:.6; transform:scale(.84); }
  .phase-movement .pre-glow{ opacity:.88; transform:scale(1.05); }
  .phase-gather .pre-glow{ opacity:1; transform:scale(1.22); }
  .phase-create .pre-glow{
    opacity:0; transform:scale(1.3);
    transition: opacity .9s ease, transform 1s var(--ease-soft);
  }

  .ring{
    position:absolute;
    left:50%; top:44%;
    width:10vmin; height:10vmin;
    margin-left:-5vmin; margin-top:-5vmin;
    border-radius:50%;
    border:1px solid rgba(0,144,255,.5);
    opacity:0;
    pointer-events:none;
    z-index:1;
  }
  .phase-gather .ring1{ animation: ringPulse 1.15s var(--ease-soft) forwards; }
  .phase-gather .ring2{ animation: ringPulse 1.15s var(--ease-soft) .22s forwards; border-color: rgba(0,179,126,.45); }
  @keyframes ringPulse{
    0%{ opacity:0; transform:scale(.35); }
    30%{ opacity:.7; }
    100%{ opacity:0; transform:scale(2.8); }
  }

  .lockup-frame{
    position:relative;
    perspective:1300px;
    z-index:2;
  }

  .lockup{
    position:relative;
    width:clamp(260px, 58vw, 760px);
    aspect-ratio:1179/327;
    transform-style:preserve-3d;
    opacity:0;
    filter:blur(12px);
    transform:scale(.88) rotateX(8deg) rotateY(-10deg);
    transition: opacity 1.6s var(--ease-cinematic), filter 1.8s var(--ease-cinematic), transform 2s var(--ease-cinematic);
  }
  .phase-create .lockup{
    opacity:1;
    filter:blur(0px);
    transform:scale(1) rotateX(0deg) rotateY(0deg);
  }

  .el{ position:absolute; }
  .el-icon{ left:0.085%; top:0.306%; width:33.249%; height:99.388%; }
  .el-arc{  left:34.096%; top:39.450%; width:30.703%; height:29.664%; }
  .el-one{  left:68.702%; top:39.450%; width:31.213%; height:29.664%; }

  .art{
    display:block;
    width:100%; height:100%;
    object-fit:contain;
    -webkit-mask-image: linear-gradient(115deg, #000 0%, #000 calc(var(--reveal) - 12%), transparent calc(var(--reveal) + 6%), transparent 100%);
            mask-image: linear-gradient(115deg, #000 0%, #000 calc(var(--reveal) - 12%), transparent calc(var(--reveal) + 6%), transparent 100%);
    transition: --reveal 1.65s var(--ease-cinematic);
  }
  .phase-create .icon-art{ --reveal:115%; }
  .phase-finish .arc-art{ --reveal:115%; transition: --reveal .6s var(--ease-out); }
  .phase-finish .one-art{ --reveal:115%; transition: --reveal .6s var(--ease-out) .18s; }

  .el-arc, .el-one{ transform:translateY(8px); opacity:0; transition: transform .6s var(--ease-out), opacity .6s ease; }
  .phase-finish .el-arc{ transform:translateY(0); opacity:1; }
  .phase-finish .el-one{ transform:translateY(0); opacity:1; transition-delay:.18s; }

  .sweep{
    position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.95) 48%, var(--emerald-light) 51%, var(--blue-light) 55%, transparent 64%);
    background-size:280% 280%;
    background-position:200% 0%;
    -webkit-mask-image:var(--art);
            mask-image:var(--art);
    -webkit-mask-mode:alpha; mask-mode:alpha;
    -webkit-mask-size:contain; mask-size:contain;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    mix-blend-mode:screen;
    filter:blur(2.5px);
    opacity:0;
    pointer-events:none;
    transition: background-position 1.25s var(--ease-soft), opacity .5s ease;
  }
  .phase-create .sweep-icon{ background-position:-40% 0%; opacity:1; }
  .phase-finish .sweep-icon{ opacity:0; transition-duration:.5s; }

  .phase-finish .sweep-arc{ background-position:-40% 0%; opacity:1; transition:background-position .6s var(--ease-soft), opacity .3s ease; }
  .phase-tagline .sweep-arc{ opacity:0; transition:opacity .4s ease; }

  .phase-finish .sweep-one{ background-position:-40% 0%; opacity:1; transition:background-position .6s var(--ease-soft) .18s, opacity .3s ease .18s; }
  .phase-tagline .sweep-one{ opacity:0; transition:opacity .4s ease; }

  .glowcopy{
    position:absolute;
    inset:-16%;
    z-index:-1;
    background:radial-gradient(closest-side, rgba(0,179,126,.38), rgba(0,144,255,.26) 58%, transparent 76%);
    filter:blur(26px);
    opacity:0;
    pointer-events:none;
    transition: opacity 1s ease;
  }
  .phase-create .glowcopy{ opacity:.9; transition-duration:.9s; }
  .phase-finish .glowcopy{ opacity:.4; transition-duration:1.1s; }
  .phase-idle .glowcopy{ animation: breathe 4.6s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:.32; } 50%{ opacity:.52; } }

  .reflect{
    position:absolute;
    inset:-8% -12%;
    background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.5) 47%, rgba(255,255,255,.85) 50%, rgba(255,255,255,.5) 53%, transparent 70%);
    mix-blend-mode:screen;
    opacity:0;
    transform:translateX(-60%);
    pointer-events:none;
  }
  .phase-finish .reflect{ animation: reflectSweep 1.15s var(--ease-soft) forwards; }
  @keyframes reflectSweep{
    0%{ opacity:0; transform:translateX(-60%); }
    18%{ opacity:.85; }
    100%{ opacity:0; transform:translateX(60%); }
  }
  .phase-idle .reflect{ animation: reflectIdle 9s ease-in-out infinite; animation-delay:2.6s; }
  @keyframes reflectIdle{
    0%,92%{ opacity:0; transform:translateX(-60%); }
    96%{ opacity:.22; }
    100%{ opacity:0; transform:translateX(60%); }
  }

  /* ---------- tagline ---------- */

  .tagline-wrap{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:clamp(26px, 5.2vw, 54px);
    text-align:center;
  }

  .rule{
    width:clamp(46px, 7vw, 80px);
    height:2px;
    margin-bottom:clamp(14px, 2.6vw, 22px);
    background:linear-gradient(90deg, var(--emerald), var(--blue));
    transform:scaleX(0);
    transition: transform .55s var(--ease-out);
  }
  .phase-tagline .rule{ transform:scaleX(1); }

  .tagline{
    margin:0;
    font-family:'Shippori Mincho','Noto Serif JP',serif;
    font-weight:600;
    font-size:clamp(17px, 2.5vw, 29px);
    color:var(--ink);
    letter-spacing:.35em;
    line-height:1.9;
    opacity:0;
    filter:blur(8px);
    transform:translateY(14px);
    transition: opacity 1.5s var(--ease-cinematic), filter 1.5s var(--ease-cinematic), transform 1.5s var(--ease-cinematic), letter-spacing 1.5s var(--ease-cinematic);
    max-width:90vw;
  }
  .phase-tagline .tagline{
    opacity:1; filter:blur(0px); transform:translateY(0);
    letter-spacing:.08em;
  }


  @media (max-width:767px){
    html, body{
      height:100%;
      min-height:100dvh;
      min-height:100svh;
      min-height:-webkit-fill-available;
    }
    .stage{
      min-height:100dvh;
      min-height:100svh;
      min-height:-webkit-fill-available;
      height:100dvh;
      height:100svh;
      cursor:default;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .content{ padding:4vh 5vw; }
    .lockup{ width:clamp(220px, 88vw, 760px); }
    .blob{ filter:blur(52px); opacity:.32; }
    .beam{ width:42vw; }
    .tagline{
      font-size:clamp(15px, 4.2vw, 22px);
      line-height:1.75;
    }
  }

  @media (max-width:560px){
    .tagline{ letter-spacing:.2em; }
    .phase-tagline .tagline{ letter-spacing:.04em; }
  }

  @media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.4s !important;
    }
    .particles, .beam, .blob, .reflect, .ring, .sweep{ display:none !important; }
    .lockup{ transform:none !important; filter:none !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage" role="img" aria-label="ARC ONE — まだ知られていない価値を、届ける。">

  <div class="vignette" aria-hidden="true"></div>

  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <div class="impact-streak" aria-hidden="true"></div>
  <div class="impact-flash" aria-hidden="true"></div>
  <div class="beam" aria-hidden="true"></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <div class="content">

    <div class="pre-glow" aria-hidden="true"></div>
    <span class="ring ring1" aria-hidden="true"></span>
    <span class="ring ring2" aria-hidden="true"></span>

    <div class="lockup-frame">
      <div class="lockup" id="lockup">

<script>
(function(){
  var stage = document.getElementById('stage');
  var lockup = document.getElementById('lockup');
  var particlesHost = document.getElementById('particles');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var PHASES = reduced
    ? [['phase-curiosity',0],['phase-create',60],['phase-finish',260],['phase-tagline',460],['phase-idle',700]]
    : [
        ['phase-curiosity', 0],
        ['phase-movement', 650],
        ['phase-gather', 1450],
        ['phase-create', 2250],
        ['phase-finish', 3600],
        ['phase-tagline', 4500],
        ['phase-idle', 5700]
      ];

  var timers = [];

  function clearTimers(){
    timers.forEach(function(id){ clearTimeout(id); });
    timers = [];
  }

  var parallaxActive = false;

  function play(){
    clearTimers();
    PHASES.forEach(function(p){
      var cls = p[0], delay = p[1];
      var id = setTimeout(function(){ stage.classList.add(cls); }, delay);
      timers.push(id);
    });
    var idleDelay = PHASES[PHASES.length-1][1];
    timers.push(setTimeout(function(){
      parallaxActive = true;
      lockup.style.transition = 'transform .4s ease-out';
    }, idleDelay + 200));
  }

  function reset(){
    PHASES.forEach(function(p){ stage.classList.remove(p[0]); });
    // force reflow so transitions restart cleanly
    void stage.offsetWidth;
  }

  // ---- particles ----
  if(!reduced){
    var COUNT = window.innerWidth < 768 ? 16 : 36;
    var palette = ['0,179,126', '0,144,255', '255,255,255'];
    for(var i=0;i<COUNT;i++){
      var d = document.createElement('span');
      d.className = 'particle';
      var size = 2.2 + Math.random()*4;
      var x = Math.random()*100;
      var y = Math.random()*100;
      var fx = (Math.random()*2-1) * 26;
      var fy = (Math.random()*2-1) * 30;
      var dur = 7 + Math.random()*7;
      var delay = Math.random()*-dur;
      var op = 0.32 + Math.random()*0.45;
      var color = palette[i % palette.length];
      d.style.width = size+'px';
      d.style.height = size+'px';
      d.style.left = x+'%';
      d.style.top = y+'%';
      d.style.background = 'radial-gradient(circle, rgba('+color+',.9), rgba('+color+',0) 70%)';
      d.style.boxShadow = '0 0 '+(size*2.5)+'px rgba('+color+',.35)';
      d.style.setProperty('--fx', fx+'px');
      d.style.setProperty('--fy', fy+'px');
      d.style.setProperty('--fdur', dur+'s');
      d.style.setProperty('--fdelay', delay+'s');
      d.style.setProperty('--fop', op);
      particlesHost.appendChild(d);
    }
  }

  // ---- subtle pointer parallax (engages only once the intro has settled) ----
  if(!reduced && matchMedia('(hover:hover) and (pointer:fine)').matches){
    var tx=0, ty=0, cx=0, cy=0;
    function onMove(e){
      var w = window.innerWidth, h = window.innerHeight;
      tx = ((e.clientX / w) - 0.5) * 2;
      ty = ((e.clientY / h) - 0.5) * 2;
    }
    window.addEventListener('pointermove', onMove, {passive:true});
    function raf(){
      if(parallaxActive){
        cx += (tx-cx)*0.06;
        cy += (ty-cy)*0.06;
        lockup.style.transform = 'scale(1) rotateX('+(-cy*2.2)+'deg) rotateY('+(cx*2.6)+'deg)';
      }
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
  }

  var embedded = window.parent !== window;
  var dismissed = false;

  function notifyDismiss(){
    if(!embedded || dismissed){ return; }
    dismissed = true;
    clearTimers();
    window.parent.postMessage({ type: 'arc-one-opening-dismiss' }, '*');
  }

  if(embedded){
    ['wheel','touchstart','touchmove','touchend','pointerdown','click','keydown'].forEach(function(type){
      window.addEventListener(type, function(e){
        if(dismissed){ return; }
        if(type === 'keydown'){
          var keys = ['Enter',' ','Escape','ArrowDown','ArrowUp','PageDown','PageUp'];
          if(keys.indexOf(e.key) === -1){ return; }
        }
        notifyDismiss();
      }, { passive: true, capture: true });
    });
  }

  stage.addEventListener('click', function(){
    if(embedded){
      notifyDismiss();
      return;
    }
    parallaxActive = false;
    lockup.style.transform = '';
    lockup.style.transition = '';
    reset();
    requestAnimationFrame(function(){ requestAnimationFrame(play); });
  });

  play();
})();
</script>
</body>
</html>
