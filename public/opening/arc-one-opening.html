<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARC ONE — Opening</title>
<style>
  :root {
    --white: #ffffff;
    --black: #0a0c10;
    --ink: #12151c;
    --emerald: #00d586;
    --emerald-dark: #00a86a;
    --blue: #0072ce;
    --blue-light: #4da3ea;
    --ease-out: cubic-bezier(.16, .8, .24, 1);
    --ease-expo: cubic-bezier(0.19, 1, 0.22, 1);
    --ease-snap: cubic-bezier(0.6, 0.01, 0.05, 0.95);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .stage {
    position: relative;
    width: 100%; height: 100svh;
    min-height: 500px;
    background: var(--black);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* Background grid */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0;
    transform: scale(1.1);
    transition: opacity 1.2s ease, transform 2s var(--ease-expo);
  }

  .phase-enter .grid-bg {
    opacity: 1;
    transform: scale(1);
  }

  /* Scan line effect */
  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--emerald), var(--blue), transparent);
    opacity: 0;
    top: -2px;
    box-shadow: 0 0 30px var(--emerald), 0 0 60px var(--blue);
  }

  .phase-scan .scan-line {
    animation: scanDown 0.8s var(--ease-snap) forwards;
  }

  @keyframes scanDown {
    0% { top: -2px; opacity: 1; }
    100% { top: 100%; opacity: 0.3; }
  }

  /* Flash overlay */
  .flash {
    position: absolute;
    inset: 0;
    background: var(--white);
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }

  .phase-flash .flash {
    animation: flashPulse 0.4s ease-out forwards;
  }

  @keyframes flashPulse {
    0% { opacity: 0; }
    30% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Particle system */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    opacity: 0;
  }

  .phase-explode .particle {
    animation: particleExplode var(--dur, 1.2s) var(--ease-expo) forwards;
    animation-delay: var(--delay, 0s);
  }

  @keyframes particleExplode {
    0% {
      opacity: 1;
      transform: translate(0, 0) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(var(--tx), var(--ty)) scale(0);
    }
  }

  /* Glitch noise layer */
  .glitch-noise {
    position: absolute;
    inset: 0;
    background: url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.4"/></svg>');
    opacity: 0;
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .phase-glitch .glitch-noise {
    animation: noiseFlicker 0.15s steps(3) 4;
  }

  @keyframes noiseFlicker {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.3; }
  }

  /* Logo container */
  .logo-wrap {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Icon part */
  .logo-icon {
    width: clamp(100px, 28vw, 220px);
    height: auto;
    opacity: 0;
    transform: scale(0.3) translateY(40px);
    filter: blur(20px);
  }

  .phase-icon .logo-icon {
    animation: iconReveal 1.2s var(--ease-expo) forwards;
  }

  @keyframes iconReveal {
    0% {
      opacity: 0;
      transform: scale(0.3) translateY(40px);
      filter: blur(20px);
    }
    50% {
      opacity: 1;
      filter: blur(0);
    }
    100% {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0);
    }
  }

  /* Text row (ARC + ONE) */
  .logo-text-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vw, 24px);
    margin-top: clamp(-10px, -2vw, -20px);
  }

  .logo-arc, .logo-one {
    height: clamp(28px, 8vw, 72px);
    width: auto;
    opacity: 0;
  }

  /* ARC slides in from left with glitch */
  .logo-arc {
    transform: translateX(-100vw);
  }

  .phase-text .logo-arc {
    animation: arcSlide 0.8s var(--ease-snap) forwards;
  }

  @keyframes arcSlide {
    0% {
      opacity: 1;
      transform: translateX(-100vw);
    }
    70% {
      transform: translateX(10px);
    }
    85% {
      transform: translateX(-5px);
    }
    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }

  /* ONE slides in from right with glitch */
  .logo-one {
    transform: translateX(100vw);
  }

  .phase-text .logo-one {
    animation: oneSlide 0.8s var(--ease-snap) forwards;
    animation-delay: 0.1s;
  }

  @keyframes oneSlide {
    0% {
      opacity: 1;
      transform: translateX(100vw);
    }
    70% {
      transform: translateX(-10px);
    }
    85% {
      transform: translateX(5px);
    }
    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }

  /* Glitch effect on text */
  .phase-glitch .logo-arc {
    animation: glitchArc 0.4s steps(2) 2;
  }

  .phase-glitch .logo-one {
    animation: glitchOne 0.4s steps(2) 2;
  }

  @keyframes glitchArc {
    0%, 100% { transform: translate(0); filter: none; }
    25% { transform: translate(-3px, 2px); filter: hue-rotate(90deg); }
    50% { transform: translate(3px, -1px); filter: hue-rotate(-90deg); }
    75% { transform: translate(-2px, -2px); filter: saturate(2); }
  }

  @keyframes glitchOne {
    0%, 100% { transform: translate(0); filter: none; }
    25% { transform: translate(3px, -2px); filter: hue-rotate(-90deg); }
    50% { transform: translate(-3px, 1px); filter: hue-rotate(90deg); }
    75% { transform: translate(2px, 2px); filter: saturate(2); }
  }

  /* RGB split effect */
  .logo-arc-glitch, .logo-one-glitch {
    position: absolute;
    opacity: 0;
    mix-blend-mode: screen;
  }

  .logo-arc-glitch { left: 0; }
  .logo-one-glitch { right: 0; }

  .phase-glitch .logo-arc-glitch,
  .phase-glitch .logo-one-glitch {
    animation: rgbSplit 0.3s steps(2) 3;
  }

  @keyframes rgbSplit {
    0%, 100% { opacity: 0; transform: translate(0); }
    50% { opacity: 0.7; transform: translate(var(--rgb-x, 4px), var(--rgb-y, -2px)); }
  }

  /* Burst lines */
  .burst-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .burst-line {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200vmax;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--emerald) 20%, var(--blue) 50%, var(--emerald) 80%, transparent 100%);
    transform-origin: center;
    opacity: 0;
  }

  .phase-burst .burst-line {
    animation: burstExpand 0.6s var(--ease-expo) forwards;
  }

  @keyframes burstExpand {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%) rotate(var(--angle)) scaleX(0);
    }
    50% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) rotate(var(--angle)) scaleX(1);
    }
  }

  /* Circular pulse */
  .pulse-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    border: 2px solid var(--emerald);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
  }

  .phase-pulse .pulse-ring {
    animation: pulseExpand 1s var(--ease-out) forwards;
    animation-delay: var(--delay, 0s);
  }

  @keyframes pulseExpand {
    0% {
      opacity: 1;
      width: 10px;
      height: 10px;
      border-width: 3px;
    }
    100% {
      opacity: 0;
      width: 150vmax;
      height: 150vmax;
      border-width: 1px;
    }
  }

  /* Final reveal state */
  .phase-reveal .logo-wrap {
    animation: logoSettle 1s var(--ease-expo) forwards;
  }

  @keyframes logoSettle {
    0% { transform: scale(1); }
    30% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  /* Tagline */
  .tagline {
    position: absolute;
    bottom: 20%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: clamp(10px, 2.5vw, 14px);
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0;
    white-space: nowrap;
  }

  .phase-tagline .tagline {
    animation: taglineReveal 1.2s var(--ease-expo) forwards;
  }

  @keyframes taglineReveal {
    0% {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      letter-spacing: 0.5em;
    }
    100% {
      opacity: 0.6;
      transform: translateX(-50%) translateY(0);
      letter-spacing: 0.3em;
    }
  }

  /* Skip hint */
  .skip-hint {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.25);
    font-size: 10px;
    letter-spacing: 0.15em;
    opacity: 0;
    cursor: pointer;
  }

  .phase-tagline .skip-hint {
    animation: fadeIn 0.8s ease 0.5s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Background gradient shift */
  .bg-gradient {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, #0f1218 0%, var(--black) 100%);
    transition: background 1s ease;
  }

  .phase-reveal .bg-gradient {
    background: radial-gradient(ellipse at 50% 50%, #14181f 0%, var(--black) 100%);
  }

  /* Ambient glow */
  .ambient-glow {
    position: absolute;
    width: 60vw;
    height: 60vw;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0;
    pointer-events: none;
  }

  .ambient-glow.green {
    background: var(--emerald);
    left: -20%;
    top: 20%;
  }

  .ambient-glow.blue {
    background: var(--blue);
    right: -20%;
    bottom: 20%;
  }

  .phase-reveal .ambient-glow {
    animation: ambientPulse 3s ease infinite alternate;
  }

  .ambient-glow.green { animation-delay: 0s; }
  .ambient-glow.blue { animation-delay: 1.5s; }

  @keyframes ambientPulse {
    0% { opacity: 0.08; transform: scale(0.9); }
    100% { opacity: 0.15; transform: scale(1.1); }
  }

  /* Horizontal lines decoration */
  .h-lines {
    position: absolute;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    opacity: 0;
  }

  .h-lines.top { top: 15%; }
  .h-lines.bottom { bottom: 15%; }

  .h-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  }

  .phase-reveal .h-lines {
    animation: linesReveal 1.5s var(--ease-expo) forwards;
  }

  @keyframes linesReveal {
    0% { opacity: 0; transform: scaleX(0); }
    100% { opacity: 1; transform: scaleX(1); }
  }

  /* Corner accents */
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,0.1);
    opacity: 0;
  }

  .corner.tl { top: 5%; left: 5%; border-right: none; border-bottom: none; }
  .corner.tr { top: 5%; right: 5%; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 5%; left: 5%; border-right: none; border-top: none; }
  .corner.br { bottom: 5%; right: 5%; border-left: none; border-top: none; }

  .phase-reveal .corner {
    animation: cornerReveal 0.8s var(--ease-out) forwards;
  }

  .corner.tr, .corner.br { animation-delay: 0.1s; }
  .corner.bl, .corner.br { animation-delay: 0.2s; }

  @keyframes cornerReveal {
    0% { opacity: 0; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      transition-duration: 0.01ms !important;
    }
    .logo-icon, .logo-arc, .logo-one {
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }
  }
</style>
</head>
<body>
<div class="stage" id="stage" role="img" aria-label="ARC ONE オープニングアニメーション" tabindex="0">
  <span class="sr-only">クリックまたはタップでスキップ</span>

  <div class="bg-gradient"></div>
  <div class="grid-bg"></div>

  <div class="ambient-glow green"></div>
  <div class="ambient-glow blue"></div>

  <div class="h-lines top">
    <div class="h-line"></div>
    <div class="h-line"></div>
  </div>
  <div class="h-lines bottom">
    <div class="h-line"></div>
    <div class="h-line"></div>
  </div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="scan-line"></div>
  <div class="flash"></div>
  <div class="glitch-noise"></div>

  <div class="burst-lines" id="burstLines"></div>
  <div class="particles" id="particles"></div>

  <div id="pulseRings"></div>

  <div class="logo-wrap">
    <img class="logo-icon" src="/images/logo-part-icon.png" alt="" aria-hidden="true" draggable="false">
    <div class="logo-text-row">
      <div style="position:relative;">
        <img class="logo-arc" src="/images/logo-part-arc.png" alt="" aria-hidden="true" draggable="false">
        <img class="logo-arc-glitch" src="/images/logo-part-arc.png" alt="" aria-hidden="true" draggable="false" style="--rgb-x: 5px; --rgb-y: -3px; filter: hue-rotate(60deg);">
      </div>
      <div style="position:relative;">
        <img class="logo-one" src="/images/logo-part-one.png" alt="" aria-hidden="true" draggable="false">
        <img class="logo-one-glitch" src="/images/logo-part-one.png" alt="" aria-hidden="true" draggable="false" style="--rgb-x: -5px; --rgb-y: 3px; filter: hue-rotate(-60deg);">
      </div>
    </div>
  </div>

  <div class="tagline">Digital Transformation Partner</div>
  <div class="skip-hint">Click to enter</div>
</div>

<script>
(function() {
  'use strict';

  const stage = document.getElementById('stage');
  const burstContainer = document.getElementById('burstLines');
  const particlesContainer = document.getElementById('particles');
  const pulseContainer = document.getElementById('pulseRings');

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function createBurstLines() {
    const count = 12;
    for (let i = 0; i < count; i++) {
      const line = document.createElement('div');
      line.className = 'burst-line';
      line.style.setProperty('--angle', `${(360 / count) * i}deg`);
      burstContainer.appendChild(line);
    }
  }

  function createParticles() {
    const count = 40;
    const colors = ['#00d586', '#0072ce', '#4da3ea', '#00a86a', '#ffffff'];
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = '50%';
      p.style.top = '50%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.setProperty('--tx', `${(Math.random() - 0.5) * 200}vw`);
      p.style.setProperty('--ty', `${(Math.random() - 0.5) * 200}vh`);
      p.style.setProperty('--dur', `${0.8 + Math.random() * 0.6}s`);
      p.style.setProperty('--delay', `${Math.random() * 0.2}s`);
      p.style.width = `${2 + Math.random() * 6}px`;
      p.style.height = p.style.width;
      particlesContainer.appendChild(p);
    }
  }

  function createPulseRings() {
    for (let i = 0; i < 3; i++) {
      const ring = document.createElement('div');
      ring.className = 'pulse-ring';
      ring.style.setProperty('--delay', `${i * 0.15}s`);
      ring.style.borderColor = i % 2 === 0 ? '#00d586' : '#0072ce';
      pulseContainer.appendChild(ring);
    }
  }

  function runAnimation() {
    if (prefersReducedMotion) {
      stage.classList.add('phase-reveal', 'phase-tagline');
      setTimeout(dismiss, 1000);
      return;
    }

    const timeline = [
      { phase: 'phase-enter', delay: 100 },
      { phase: 'phase-scan', delay: 600 },
      { phase: 'phase-icon', delay: 200 },
      { phase: 'phase-text', delay: 800 },
      { phase: 'phase-glitch', delay: 500 },
      { phase: 'phase-flash', delay: 300 },
      { phase: 'phase-burst', delay: 100 },
      { phase: 'phase-explode', delay: 100 },
      { phase: 'phase-pulse', delay: 100 },
      { phase: 'phase-reveal', delay: 600 },
      { phase: 'phase-tagline', delay: 400 },
    ];

    let elapsed = 0;
    timeline.forEach(({ phase, delay }) => {
      elapsed += delay;
      setTimeout(() => {
        stage.classList.add(phase);
      }, elapsed);
    });
  }

  function dismiss() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'arc-one-opening-dismiss' }, '*');
    }
  }

  function handleInteraction(e) {
    if (e.type === 'keydown' && !['Enter', ' ', 'Escape'].includes(e.key)) return;
    e.preventDefault();
    dismiss();
  }

  stage.addEventListener('click', handleInteraction);
  stage.addEventListener('touchend', handleInteraction);
  stage.addEventListener('keydown', handleInteraction);

  createBurstLines();
  createParticles();
  createPulseRings();

  requestAnimationFrame(() => {
    runAnimation();
  });

  setTimeout(dismiss, prefersReducedMotion ? 1500 : 6000);
})();
</script>
</body>
</html>
